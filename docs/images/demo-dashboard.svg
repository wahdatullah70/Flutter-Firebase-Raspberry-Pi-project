<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <rect x="55" y="45" width="1090" height="610" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="95" y="105" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Solar Sprayer Monitoring Dashboard</text>
  <text x="95" y="140" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Flutter + Firebase + Raspberry Pi</text>
  <rect x="890" y="75" width="205" height="48" rx="24" fill="#7c2d12"/>
  <text x="925" y="106" fill="#ffedd5" font-family="Arial, sans-serif" font-size="18" font-weight="700">DEMO UI MOCKUP</text>

  <rect x="95" y="190" width="300" height="170" rx="20" fill="#1e293b"/>
  <text x="125" y="235" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Solar Power</text>
  <text x="125" y="305" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">118.4 W</text>
  <text x="125" y="340" fill="#86efac" font-family="Arial, sans-serif" font-size="18">● telemetry received</text>

  <rect x="450" y="190" width="300" height="170" rx="20" fill="#1e293b"/>
  <text x="480" y="235" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Battery Voltage</text>
