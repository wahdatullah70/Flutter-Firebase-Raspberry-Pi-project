  <text x="835" y="340" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">API: /data</text>

  <rect x="95" y="405" width="1000" height="190" rx="20" fill="#1e293b"/>
  <text x="125" y="452" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">System Flow</text>
  <text x="125" y="500" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">Flutter App  →  Firebase Auth / Firestore / Storage</text>
  <text x="125" y="540" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">Flutter App  →  HTTPS GET /data  →  Raspberry Pi Flask API  →  Sensor adapter</text>
  <text x="125" y="580" fill="#fbbf24" font-family="Arial, sans-serif" font-size="17">Illustrative values only — not a screenshot from a physical deployment.</text>
