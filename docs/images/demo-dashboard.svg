  <text x="480" y="340" fill="#86efac" font-family="Arial, sans-serif" font-size="18">● normal range</text>

  <rect x="805" y="190" width="290" height="170" rx="20" fill="#1e293b"/>
  <text x="835" y="235" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Device Status</text>
